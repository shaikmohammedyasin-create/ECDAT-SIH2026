# Enterprise Gateway Nginx TLS Configuration
server {
    listen 443 ssl http2;
    server_name api.enterprise-secure.internal;

    # TLS Protocols (Includes legacy TLSv1.0 and TLSv1.1)
    ssl_protocols TLSv1.0 TLSv1.1 TLSv1.2 TLSv1.3;

    # Cipher Suites (Contains ECDHE-RSA and AES128-SHA which are vulnerable to Shor & Grover)
    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-SHA:AES128-SHA:DES-CBC3-SHA';
    ssl_prefer_server_ciphers on;

    ssl_certificate /etc/ssl/certs/server.crt;
    ssl_certificate_key /etc/ssl/private/server.key;

    # Diffie-Hellman Parameters (DH 2048)
    ssl_dhparam /etc/ssl/certs/dhparam2048.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
}
