# Controlled Nginx TLS Server Configuration
server {
    listen 443 ssl;
    server_name secure.enterprise.ntro;

    # TLS Protocols (legacy TLS 1.0 and 1.1 + modern TLS 1.2 and 1.3)
    ssl_protocols TLSv1.0 TLSv1.1 TLSv1.2 TLSv1.3;

    # SSL Ciphers (Contains weak DES, RSA key exchange, AES)
    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:DES-CBC3-SHA';
    ssl_prefer_server_ciphers on;

    # DH parameter for key exchange
    ssl_dhparam /etc/ssl/certs/dhparam2048.pem;

    # Certificate reference
    ssl_certificate /etc/ssl/certs/server.crt;
    ssl_certificate_key /etc/ssl/private/server.key;
}
